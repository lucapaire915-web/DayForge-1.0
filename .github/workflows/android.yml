name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar archivos
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          for f in icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png; do
            if [ -f "$f" ]; then cp "$f" assets/; fi
          done

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Agregar bloqueo de apps (modo enfoque)
        run: python3 native/prepare_android.py

      - name: Íconos y pantalla de inicio
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DayForge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
