name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar archivos
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          for f in icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png; do
            if [ -f "$f" ]; then cp "$f" assets/; fi
          done

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Agregar bloqueo de apps (modo enfoque)
        run: |
          # Todo el código nativo del bloqueador vive acá y se copia al proyecto Android en cada compilación.
          mkdir -p android/app/src/main/java/com/dayforge/app
          cat > android/app/src/main/java/com/dayforge/app/DayForgeNative.java <<'DAYFORGE_EOF'
          package com.dayforge.app;

          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.provider.Settings;
          import android.text.TextUtils;
          import android.webkit.JavascriptInterface;

          /** Puente entre la web (window.DayForgeNative) y el bloqueo de apps. */
          public class DayForgeNative {
              static final String PREFS = "dayforge_block";
              static final String KEY_ON = "on";

              private final Context ctx;

              public DayForgeNative(Context context) {
                  this.ctx = context.getApplicationContext();
              }

              static boolean isOn(Context c) {
                  return c.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getBoolean(KEY_ON, false);
              }

              static boolean serviceEnabled(Context c) {
                  String list = Settings.Secure.getString(c.getContentResolver(),
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  if (list == null) return false;
                  ComponentName me = new ComponentName(c, BlockerService.class);
                  TextUtils.SimpleStringSplitter sp = new TextUtils.SimpleStringSplitter(':');
                  sp.setString(list);
                  while (sp.hasNext()) {
                      ComponentName cn = ComponentName.unflattenFromString(sp.next());
                      if (cn != null && cn.equals(me)) return true;
                  }
                  return false;
              }

              /** true = quedó como pedías. false = falta dar el permiso (se abre Accesibilidad). */
              @JavascriptInterface
              public boolean setAppBlock(boolean on) {
                  if (on && !serviceEnabled(ctx)) {
                      openPermissionSettings();
                      return false;
                  }
                  SharedPreferences.Editor e = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit();
                  e.putBoolean(KEY_ON, on).apply();
                  return true;
              }

              @JavascriptInterface
              public boolean isBlocking() {
                  return isOn(ctx) && serviceEnabled(ctx);
              }

              @JavascriptInterface
              public boolean hasPermission() {
                  return serviceEnabled(ctx);
              }

              @JavascriptInterface
              public void openPermissionSettings() {
                  Intent i = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  ctx.startActivity(i);
              }
          }
          DAYFORGE_EOF
          mkdir -p android/app/src/main/java/com/dayforge/app
          cat > android/app/src/main/java/com/dayforge/app/BlockerService.java <<'DAYFORGE_EOF'
          package com.dayforge.app;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.telecom.TelecomManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.inputmethod.InputMethodInfo;
          import android.view.inputmethod.InputMethodManager;

          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;

          /**
           * Servicio de accesibilidad: solo mira QUÉ app se abrió (nombre del paquete).
           * No lee pantallas, textos ni contraseñas (canRetrieveWindowContent = false).
           */
          public class BlockerService extends AccessibilityService {

              /** Apps que SIEMPRE se dejan pasar, aunque el bloqueo esté activo. */
              private static final String[] ALLOWED = {
                  // DayForge se agrega solo (getPackageName)
                  // WhatsApp
                  "com.whatsapp", "com.whatsapp.w4b",
                  // Teléfono / llamadas
                  "com.google.android.dialer", "com.android.dialer", "com.samsung.android.dialer",
                  "com.android.incallui", "com.samsung.android.incallui", "com.android.phone",
                  "com.android.server.telecom", "com.google.android.telecom",
                  // Interfaz del sistema
                  "android", "com.android.systemui", "com.google.android.systemui",
                  "com.android.permissioncontroller", "com.google.android.permissioncontroller",
                  "com.google.android.packageinstaller", "com.android.packageinstaller",
                  "com.android.documentsui", "com.google.android.documentsui",
                  "com.android.providers.media.module", "com.google.android.providers.media.module",
                  "com.android.inputmethod.latin", "com.google.android.inputmethod.latin",
                  "com.samsung.android.honeyboard", "com.touchtype.swiftkey"
              };

              /** Cambialo a true si querés bloquear también Ajustes. */
              private static final boolean BLOCK_SETTINGS = false;
              private static final String[] SETTINGS = {
                  "com.android.settings", "com.samsung.android.settings"
              };

              private final Set<String> allowed = new HashSet<>();
              private long lastLaunch = 0;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  refreshAllowed();
              }

              /** Arma la lista de permitidos: fija + launcher + teclados + marcador por defecto. */
              private void refreshAllowed() {
                  allowed.clear();
                  allowed.add(getPackageName());
                  for (String p : ALLOWED) allowed.add(p);
                  if (!BLOCK_SETTINGS) for (String p : SETTINGS) allowed.add(p);
                  try {
                      Intent home = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME);
                      List<ResolveInfo> hs = getPackageManager().queryIntentActivities(home, 0);
                      for (ResolveInfo r : hs) allowed.add(r.activityInfo.packageName);
                  } catch (Exception ignored) { }
                  try {
                      InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                      for (InputMethodInfo i : imm.getEnabledInputMethodList()) allowed.add(i.getPackageName());
                  } catch (Exception ignored) { }
                  try {
                      TelecomManager tm = (TelecomManager) getSystemService(Context.TELECOM_SERVICE);
                      String d = tm.getDefaultDialerPackage();
                      if (d != null) allowed.add(d);
                  } catch (Exception ignored) { }
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent ev) {
                  if (ev == null || ev.getEventType() != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return;
                  if (!DayForgeNative.isOn(this)) return;
                  CharSequence cs = ev.getPackageName();
                  if (cs == null) return;
                  String pkg = cs.toString();
                  if (allowed.contains(pkg)) return;
                  // El teclado o el launcher pudieron cambiar desde la última vez: reintento una vez.
                  refreshAllowed();
                  if (allowed.contains(pkg)) return;

                  long now = System.currentTimeMillis();
                  if (now - lastLaunch < 700) return; // evita abrir la pantalla varias veces seguidas
                  lastLaunch = now;

                  Intent i = new Intent(this, BlockActivity.class);
                  i.putExtra("pkg", pkg);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_NO_ANIMATION
                          | Intent.FLAG_ACTIVITY_EXCLUDE_FROM_RECENTS | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  startActivity(i);
              }

              @Override
              public void onInterrupt() { }
          }
          DAYFORGE_EOF
          mkdir -p android/app/src/main/java/com/dayforge/app
          cat > android/app/src/main/java/com/dayforge/app/BlockActivity.java <<'DAYFORGE_EOF'
          package com.dayforge.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          /** Pantalla que tapa la app bloqueada. Sin archivos de diseño: todo se arma por código. */
          public class BlockActivity extends Activity {

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  build(getIntent());
              }

              @Override
              protected void onNewIntent(Intent i) {
                  super.onNewIntent(i);
                  setIntent(i);
                  build(i);
              }

              private void build(Intent in) {
                  String pkg = in.getStringExtra("pkg");
                  String name = pkg;
                  try {
                      PackageManager pm = getPackageManager();
                      name = pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString();
                  } catch (Exception ignored) { }

                  float d = getResources().getDisplayMetrics().density;

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setBackgroundColor(Color.parseColor("#0F1115"));
                  int pad = (int) (28 * d);
                  root.setPadding(pad, pad, pad, pad);

                  TextView ic = new TextView(this);
                  ic.setText("🔒");
                  ic.setTextSize(56);
                  ic.setGravity(Gravity.CENTER);
                  root.addView(ic);

                  TextView t = new TextView(this);
                  t.setText("Modo enfoque activo");
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(24);
                  t.setTypeface(Typeface.DEFAULT_BOLD);
                  t.setGravity(Gravity.CENTER);
                  t.setPadding(0, (int) (12 * d), 0, (int) (8 * d));
                  root.addView(t);

                  TextView s = new TextView(this);
                  s.setText((name != null ? name : "Esta app") + " está bloqueada mientras te enfocás.\n"
                          + "Para salir, abrí DayForge y tocá \"Apps bloqueadas\".");
                  s.setTextColor(Color.parseColor("#B8BDC9"));
                  s.setTextSize(16);
                  s.setGravity(Gravity.CENTER);
                  s.setPadding(0, 0, 0, (int) (28 * d));
                  root.addView(s);

                  root.addView(button("Abrir DayForge", true, new View.OnClickListener() {
                      @Override public void onClick(View v) {
                          Intent i = new Intent(BlockActivity.this, MainActivity.class);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                          startActivity(i);
                          finish();
                      }
                  }, d));
                  root.addView(button("Volver al inicio", false, new View.OnClickListener() {
                      @Override public void onClick(View v) { goHome(); }
                  }, d));

                  setContentView(root);
              }

              private Button button(String text, boolean primary, View.OnClickListener l, float d) {
                  Button bt = new Button(this);
                  bt.setText(text);
                  bt.setAllCaps(false);
                  bt.setTextSize(16);
                  bt.setTextColor(Color.WHITE);
                  GradientDrawable g = new GradientDrawable();
                  g.setCornerRadius(14 * d);
                  g.setColor(Color.parseColor(primary ? "#0A84FF" : "#2A2D35"));
                  bt.setBackground(g);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, (int) (52 * d));
                  lp.setMargins(0, 0, 0, (int) (10 * d));
                  bt.setLayoutParams(lp);
                  bt.setOnClickListener(l);
                  return bt;
              }

              private void goHome() {
                  Intent h = new Intent(Intent.ACTION_MAIN);
                  h.addCategory(Intent.CATEGORY_HOME);
                  h.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  startActivity(h);
                  finish();
              }

              @Override
              public void onBackPressed() { goHome(); }

              @Override
              protected void onStop() {
                  super.onStop();
                  if (!isFinishing()) finish();
              }
          }
          DAYFORGE_EOF
          mkdir -p android/app/src/main/java/com/dayforge/app
          cat > android/app/src/main/java/com/dayforge/app/MainActivity.java <<'DAYFORGE_EOF'
          package com.dayforge.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getBridge().getWebView().addJavascriptInterface(new DayForgeNative(this), "DayForgeNative");
              }
          }
          DAYFORGE_EOF
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/accessibility_service_config.xml <<'DAYFORGE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="100"
              android:description="@string/dayforge_block_desc" />
          DAYFORGE_EOF
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/dayforge_strings.xml <<'DAYFORGE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="dayforge_block_desc">Detecta qué app se abre para bloquearla mientras el modo enfoque de DayForge está activo. No lee tu pantalla ni tus datos.</string>
          </resources>
          DAYFORGE_EOF
          python3 - <<'DAYFORGE_EOF'
          import re, sys
          p = "android/app/src/main/AndroidManifest.xml"
          m = open(p, encoding="utf-8").read()
          if "BlockerService" in m:
              sys.exit(0)
          queries = """
              <queries>
                  <intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.HOME" /></intent>
                  <intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent>
              </queries>

              <application"""
          extra = """
                  <activity
                      android:name=".BlockActivity"
                      android:exported="false"
                      android:launchMode="singleTask"
                      android:taskAffinity=""
                      android:excludeFromRecents="true"
                      android:enableOnBackInvokedCallback="false"
                      android:theme="@android:style/Theme.Material.NoActionBar" />

                  <service
                      android:name=".BlockerService"
                      android:exported="true"
                      android:label="DayForge - Modo enfoque"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>"""
          m = m.replace("<application", queries, 1).replace("</application>", extra, 1)
          open(p, "w", encoding="utf-8").write(m)
          DAYFORGE_EOF

      - name: Íconos y pantalla de inicio
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DayForge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DayForge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
